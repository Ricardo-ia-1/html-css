<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudos de iframe</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        h1 {
            color: #333;
        }
        p {
            margin-bottom: 20px;
        }
        iframe {
            width: 400px;
            height: 400px;
            border: 1px solid #ccc;
            margin-right: 10px;
        }
    </style>
</head>
<body>
    <h1>Testando o uso de iframe</h1>
    <p>Acesando o site do 
        <!-- Tamanho padrão do iframe: 300x150 -->
        <iframe src="https://www.cursoemvideo.com" frameborder="0"></iframe>
        <a href="https://www.cursoemvideo.com">curso em video</a>
        
    para aprender a programar.</p>

    <p>
        O site do 

        <iframe src="https://www.google.com" frameborder="0"></iframe>

        também é muito bom para pesquisas, pena que não funciona dentro do iframe.

        <strong>Obs:</strong> O Google não permite ser carregado em iframes por questões de segurança.
    </p>
    <p>
        O repositorio do Guanabara

        <iframe src="https://gustavoguanabara.github.io" frameborder="0"></iframe>

        também é bem legal!
    </p>
</body>
</html>
