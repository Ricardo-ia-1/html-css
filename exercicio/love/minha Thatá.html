<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Meu Amor</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;600&display=swap" rel="stylesheet">
    <style>
        :root{
            --bg1:#ff9aac;
            --bg2:#7b2ff7;
            --card-bg: rgba(255,255,255,0.06);
            --glass: rgba(255,255,255,0.08);
            --accent:#ff5c8a;
        }
        *{box-sizing:border-box;margin:0;padding:0}
        html,body{height:100%}
        body{
            font-family:"Poppins",system-ui,Segoe UI,Roboto,Arial;
            background: radial-gradient(farthest-side at 10% 20%, rgba(255,255,255,0.06), transparent 10%),
                                    radial-gradient(1200px 800px at 90% 80%, rgba(255,255,255,0.03), transparent 20%),
                                    linear-gradient(135deg,var(--bg1), var(--bg2));
            background-attachment: fixed;
            color:#fff;
            display:flex;
            align-items:center;
            justify-content:center;
            padding:40px;
            overflow:hidden;
        }

        /* Floating hearts background */
        .bg-heart{
            position:absolute;
            inset:0;
            pointer-events:none;
        }
        .bg-heart span{
            position:absolute;
            font-size:18px;
            opacity:0.12;
            transform:translateY(0);
            animation: drift 10s linear infinite;
            filter: drop-shadow(0 6px rgba(0,0,0,0.15));
        }
        @keyframes drift{
            0%{transform:translateY(0) rotate(0deg); opacity:0.12}
            50%{opacity:0.25}
            100%{transform:translateY(-600px) rotate(360deg); opacity:0}
        }

        .card{
            position:relative;
            width:min(900px,96%);
            max-width:1000px;
            padding:48px;
            border-radius:20px;
            background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
            box-shadow: 0 8px 40px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.03);
            backdrop-filter: blur(6px) saturate(120%);
            display:grid;
            grid-template-columns: 1fr 360px;
            gap:30px;
            align-items:center;
            overflow:visible;
        }

        /* Left text */
        .hero{
            padding:10px 6px;
        }
        h1{
            font-family:"Great Vibes", serif;
            font-size:72px;
            line-height:0.9;
            margin-bottom:6px;
            text-shadow: 0 6px 30px rgba(123,47,247,0.25);
            letter-spacing:1px;
        }
        p.lead{
            font-size:18px;
            color:rgba(255,255,255,0.92);
            margin-bottom:22px;
            max-width:55ch;
        }
        .meta{
            display:flex;
            gap:12px;
            align-items:center;
            flex-wrap:wrap;
        }
        .pill{
            background:var(--glass);
            padding:10px 14px;
            border-radius:999px;
            font-weight:600;
            color:#fff;
            box-shadow: inset 0 -6px 18px rgba(255,255,255,0.02);
        }

        /* Right panel with heart and action */
        .side{
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
            gap:18px;
        }
        .big-heart{
            width:180px;
            height:180px;
            display:grid;
            place-items:center;
            border-radius:50%;
            background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.06), transparent 20%),
                                    linear-gradient(180deg,#ff7aa6,#ff4b84 70%);
            box-shadow: 0 20px 40px rgba(255,92,138,0.18), 0 2px 6px rgba(0,0,0,0.2);
            transform: rotate(-10deg);
        }
        .big-heart svg{width:110px;height:110px;filter:drop-shadow(0 8px rgba(0,0,0,0.15))}

        .btn{
            background: linear-gradient(90deg,var(--accent),#ff7bb9);
            color:#fff;
            padding:12px 20px;
            border-radius:999px;
            border:0;
            font-weight:600;
            cursor:pointer;
            box-shadow: 0 8px 24px rgba(255,92,138,0.18);
        }
        .btn:active{transform:translateY(1px)}
        .note{
            font-size:13px;
            color:rgba(255,255,255,0.78);
            text-align:center;
        }

        /* floating hearts created by JS */
        .floating-heart{
            position:fixed;
            pointer-events:none;
            font-size:22px;
            will-change:transform,opacity;
            animation: floatUp 2.2s ease-out forwards;
            text-shadow: 0 6px 12px rgba(0,0,0,0.25);
        }
        @keyframes floatUp{
            0%{transform:translateY(0) scale(0.8); opacity:1}
            25%{transform:translateY(-40px) scale(1.05)}
            100%{transform:translateY(-260px) scale(0.8); opacity:0}
        }

        /* responsive */
        @media (max-width:820px){
            .card{grid-template-columns:1fr; text-align:center}
            .hero h1{font-size:56px}
            .big-heart{margin:0 auto}
        }
    </style>
</head>
<body>
    <div class="bg-heart" aria-hidden="true">
        <!-- decorative hearts -->
        <span style="left:8%;top:70%;font-size:20px;animation-duration:14s;opacity:0.08">💖</span>
        <span style="left:22%;top:85%;font-size:28px;animation-duration:11s;opacity:0.09">💕</span>
        <span style="left:40%;top:78%;font-size:24px;animation-duration:12s;opacity:0.06">❤️</span>
        <span style="left:62%;top:90%;font-size:20px;animation-duration:16s;opacity:0.07">💘</span>
        <span style="left:80%;top:75%;font-size:22px;animation-duration:13s;opacity:0.05">💓</span>
    </div>

    <main class="card" role="main" aria-labelledby="title">
        <section class="hero">
            <h1 id="title">Meu Amor</h1>
            <p class="lead">Cada batida do meu coração pensa em você. Hoje, amanhã e sempre — quero transformar momentos simples em memórias eternas ao seu lado.</p>

            <div class="meta" aria-hidden="true">
                <div class="pill">Sob o brilho das estrelas</div>
                <div class="pill">Promessas doces</div>
                <div class="pill">Beijos infinitos</div>
            </div>
        </section>

        <aside class="side" aria-label="Ações românticas">
            <div class="big-heart" aria-hidden="true">
                <!-- heart SVG -->
                <svg viewBox="0 0 32 29" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <path d="M23.6 2.6c-2.1 0-4 1-5.2 2.6-1.2-1.6-3-2.6-5.1-2.6C7.2 2.6 4 6 4 10.1 4 18 16 26 16 26s12-8 12-15.9c0-4.1-3.2-7.5-4.4-7.5z" fill="#fff" opacity="0.12"/>
                    <path d="M23.6 1.4c-2.5 0-4.8 1.3-6.1 3.4-1.3-2.1-3.6-3.4-6.1-3.4C6 1.4 2 5.8 2 10.8 2 19 16 28 16 28s14-9 14-17.2C30 5.8 26 1.4 23.6 1.4z" fill="#fff"/>
                </svg>
            </div>

            <button class="btn" id="kissBtn" type="button" aria-pressed="false">Me dê um beijo 💋</button>
            <div class="note">Clique no botão para enviar muitos beijinhos flutuantes ✨</div>
        </aside>
    </main>

    <script>
        // Cria corações flutuantes ao clicar no botão
        const btn = document.getElementById('kissBtn');
        function rand(min, max){ return Math.random() * (max - min) + min }

        btn.addEventListener('click', () => {
            btn.setAttribute('aria-pressed','true');
            for(let i=0;i<12;i++){
                const h = document.createElement('div');
                h.className = 'floating-heart';
                h.style.left = (rand(20,80)) + '%';
                h.style.top = (rand(40,85)) + '%';
                h.style.fontSize = Math.floor(rand(18,34)) + 'px';
                h.style.animationDelay = (rand(0,0.6)) + 's';
                // use various heart emojis for variety
                const hearts = ['💖','💕','❤️','💘','💓','💝'];
                h.textContent = hearts[Math.floor(rand(0, hearts.length))];
                document.body.appendChild(h);
                // remove after animation
                setTimeout(()=> h.remove(), 2600 + Math.random()*400);
            }
            // small pulse effect
            btn.animate([
                {transform:'scale(1)'},
                {transform:'scale(0.96)'}
            ], {duration:150, easing:'ease-out'});
            // reset aria-pressed after short time
            setTimeout(()=>btn.setAttribute('aria-pressed','false'),700);
        });
    </script>
</body>
</html></svg>
