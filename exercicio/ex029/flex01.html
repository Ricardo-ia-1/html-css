<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        .conteiner {
            display: flex;
            align-items: center;
            width: 100%;
            height: 100vh;
            background-color: #f0f0f0;
        }
        .item {
            background-color: #4CAF50;
            color: white;
            padding: 20px;
            margin: 10px;
            text-align: center;
            border-radius: 5px;
            flex: auto; 
        }
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item item">Item 1</div>
        <div class="item item">Item 2</div>
        <div class="item item">Item 3</div>
        <div class="item item">Item 4</div>
        <div class="item item">Item 5</div>
    </div>
</body>
</html>
