<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formulario</title>
</head>
<body>
    <h1>Exemplos de formulário</h1>
    <form action="recebe_dados.php" method="get" autocomplete="on">
        <p>
            <label for="iest">Estado</label>
            <select name="estado" id="iest">
            <optgroup label="Sudeste">
                <option value=""  selected >-- Escolha --</option >
                <option value="sp">São Paulo</option>
                <option value="rj">Rio de Janeiro</option>
                <option value="mg">Minas Gerais</option>
                <option value="es">Espírito Santo</option>
            
            </optgroup>

            <optgroup label="Sul">
                <option value="pr">Paraná</option>
                <option value="sc">Santa Catarina</option>
                <option value="rs">Rio Grande do Sul</option>
            </optgroup>
        </select>

        </p>
        <p>
            <label for="ipro">Profissão</label>
            <input type="text" name="profissao" id="ipro" list="datalistpro" placeholder="Digite sua profissão" required>
            <datalist id="datalistpro">
                <option value="Desenvolvedor">
                <option value="Designer">
                <option value="Gerente de Projetos">
                <option value="Analista de Sistemas">
                <option value="Estudante">
            </datalist>
  
        </p>
        <p>
            <label for="imsg">Mensagem: </label> <br>
            <textarea name="msg" id="imsg" cols="30" rows="10" placeholder="Digite sua mensagem aqui..." required></textarea>
        </p>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
