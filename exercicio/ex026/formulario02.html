<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Teste de formulário</h1>
    <form action="recebe_dados.php" method="get" autocomplete="on">
    <p>
        <label for="inome">Nome</label>
        <input type="text" name="nome" id="inome" placeholder="Digite seu nome" required autocomplete="name" maxlength="30">
    </p>

    <p>
        <label for="imedia">Média</label>
        <input type="number" name="media" id="imedia" placeholder="Digite sua média" required min="0" max="10" step="0.1" value="5">
    </p>

    <p>
        <label for="imes"> Período Letivo</label>
        <input type="month" name="mes" id="imes" required>
    </p>

    <p>
        <label for="idata"> Data da Prova</label>
        <input type="date" name="data" id="idata" required>
    </p>

    <p>
        <label for="ihora"> Hora da Prova</label>
        <input type="time" name="hora" id="ihora" required>
    </p>
    <p>
        <input type="submit" value="Enviar">
        <input type="reset" value="Limpar">
    </p>
</form>
</body>
</html>
