<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formúlario</title>
</head>
<body>
    <h1>Exemplos de formulário</h1>
    <form action="recebe_dados.php" method="get">
        <fieldset>
            <legend>Sexo</legend>
                <input type="radio" name="sexo" id="imasculino" value="masculino" required>
                <label for="imasculino">Masculino</label><br>
                <input type="radio" name="sexo" id="ifeminino" value="feminino">
                <label for="ifeminino">Feminino</label><br>
        </fieldset>
        <fieldset>
            <legend>Esportes favoritos</legend>
                <input type="checkbox" name="esportes[]" id="ifutebol" value="futebol">
                <label for="ifutebol">Futebol</label><br>
                <input type="checkbox" name="esportes[]" id="ibasquete" value="basquete">
                <label for="ibasquete">Basquete</label><br>
                <input type="checkbox" name="esportes[]" id="ivolei" value="volei">
                <label for="ivolei">Vôlei</label><br>
                <input type="checkbox" name="esportes[]" id="itennis" value="tennis">
                <label for="itennis">Tennis</label> <br>

        </fieldset>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
